spring.application.name=API-GATEWAY

# Server Configuration
server.port=8080

# Gateway Routes - Student Service
spring.cloud.gateway.routes[0].id=student-service
spring.cloud.gateway.routes[0].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/students/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=name=studentCB,fallbackUri=forward:/fallback

# Gateway Routes - Course Service
spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=lb://COURSE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/courses/**

# Gateway Routes - Enrollment Service
spring.cloud.gateway.routes[2].id=enrollment-service
spring.cloud.gateway.routes[2].uri=lb://ENROLLMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/enrollments/**

# Gateway Routes - Teacher Service
spring.cloud.gateway.routes[3].id=teacher-service
spring.cloud.gateway.routes[3].uri=lb://TEACHER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/teachers/**

# Gateway Routes - Auth Service
spring.cloud.gateway.routes[4].id=auth-service
spring.cloud.gateway.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/**

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

logging.level.org.springframework.cloud.gateway=DEBUG

jwt.secret=secret-key-for-college-management-system-2026
